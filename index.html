<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VectorBench — Electrical &amp; Control Engineering Workbench</title>
    <meta
      name="description"
      content="Interactive engineering bench for Nyquist, Bode, Root Locus, Nichols, AC Phasors, Power Circle, Routh-Hurwitz, Motor Torque-Speed, Transformer Efficiency, and Step Response plots."
    />
    <meta property="og:title" content="VectorBench — Electrical &amp; Control Engineering Workbench" />
    <meta
      property="og:description"
      content="Interactive engineering bench with calibrated plots, numerical solvers, and fine-print crosshair tooltips."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-[#090D16] dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Paste this entire snippet unchanged just before </body> on each of the four bench pages. -->
    <style>
      .bench-footer {
        --bf-bg: #F1E8D4;
        --bf-text: #3B3A38;
        --bf-link: #1F4E79;
        --bf-link-hover: #143655;
        --bf-rule: #6F6D68;
        --bf-current-bg: rgba(217, 164, 65, 0.16);

        position: static;
        width: 100%;
        margin: 0;
        padding: 28px 16px calc(24px + env(safe-area-inset-bottom, 0px));
        background-color: var(--bf-bg);
        color: var(--bf-text);
        border-top: 1px solid var(--bf-rule);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 15px;
        line-height: 1.55;
        text-align: center;
        box-sizing: border-box;
      }

      @media (prefers-color-scheme: dark) {
        .bench-footer {
          --bf-bg: #26211A;
          --bf-text: #D8D2C4;
          --bf-link: #7FB0DB;
          --bf-link-hover: #A6CBEB;
          --bf-rule: #8C8A85;
          --bf-current-bg: rgba(217, 164, 65, 0.18);
        }
      }

      .bench-footer *,
      .bench-footer *::before,
      .bench-footer *::after {
        box-sizing: border-box;
      }

      .bench-footer .bench-footer__inner {
        max-width: 760px;
        margin: 0 auto;
      }

      .bench-footer .bench-footer__flourish {
        display: block;
        margin: 0 auto 18px;
        color: var(--bf-rule);
      }

      .bench-footer .bench-footer__grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--bf-rule);
        border-left: 1px solid var(--bf-rule);
      }

      .bench-footer .bench-footer__cell {
        margin: 0;
        padding: 0;
        border-right: 1px solid var(--bf-rule);
        border-bottom: 1px solid var(--bf-rule);
        background-color: transparent;
      }

      .bench-footer .bench-footer__cell.is-current {
        background-color: var(--bf-current-bg);
      }

      .bench-footer .bench-footer__link,
      .bench-footer .bench-footer__current {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        width: 100%;
        padding: 10px 12px;
        font-size: 15px;
        line-height: 1.3;
        text-decoration: none;
      }

      .bench-footer .bench-footer__link {
        color: var(--bf-link);
        font-weight: 400;
      }

      .bench-footer .bench-footer__link:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer .bench-footer__current {
        color: var(--bf-text);
        font-weight: 700;
        cursor: default;
      }

      .bench-footer .bench-footer__central-wrap {
        margin: 18px 0 12px;
      }

      .bench-footer .bench-footer__central {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 14px;
        color: var(--bf-link);
        font-size: 16px;
        font-weight: 400;
        text-decoration: none;
      }

      .bench-footer .bench-footer__central:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer .bench-footer__more {
        margin: 0;
        font-size: 15px;
        color: var(--bf-text);
      }

      .bench-footer .bench-footer__more-link {
        color: var(--bf-link);
        text-decoration: none;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .bench-footer .bench-footer__more-link:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer a:focus-visible {
        outline: 2px solid var(--bf-link);
        outline-offset: 2px;
        text-decoration: underline;
      }

      @media (max-width: 599px) {
        .bench-footer .bench-footer__grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .bench-footer .bench-footer__more-link {
          display: block;
          margin-top: 2px;
        }
      }
    </style>

    <footer class="bench-footer">
      <div class="bench-footer__inner">
        <svg
          class="bench-footer__flourish"
          width="136"
          height="10"
          viewBox="0 0 136 10"
          fill="none"
          aria-hidden="true"
        >
          <line x1="1" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1" />
          <line x1="135" y1="1" x2="135" y2="9" stroke="currentColor" stroke-width="1" />
          <line x1="2" y1="5" x2="134" y2="5" stroke="currentColor" stroke-width="1" />
          <polyline points="8,2 2,5 8,8" stroke="currentColor" stroke-width="1" fill="none" />
          <polyline points="128,2 134,5 128,8" stroke="currentColor" stroke-width="1" fill="none" />
        </svg>

        <nav aria-label="Engineering benches">
          <ul class="bench-footer__grid">
            <li class="bench-footer__cell">
              <a
                class="bench-footer__link"
                href="https://nirmalya-panigrahi.github.io/Structural-Engineering-Bench/"
              >Structural</a>
            </li>
            <li class="bench-footer__cell">
              <a
                class="bench-footer__link"
                href="https://nirmalya-panigrahi.github.io/Process-Engineering-Bench/"
              >Process</a>
            </li>
            <li class="bench-footer__cell">
              <a
                class="bench-footer__link"
                href="https://nirmalya-panigrahi.github.io/Control-Engg-Bench/"
              >Control</a>
            </li>
            <li class="bench-footer__cell">
              <a
                class="bench-footer__link"
                href="https://nirmalya-panigrahi.github.io/Circuit-Bench-Lab/"
              >Circuit</a>
            </li>
          </ul>
        </nav>

        <div class="bench-footer__central-wrap">
          <a
            class="bench-footer__central"
            href="https://nirmalya-panigrahi.github.io/engineering-bench/"
          >All engineering benches &#8594;</a>
        </div>

        <p class="bench-footer__more">
          Find more tools at:
          <a
            class="bench-footer__more-link"
            href="https://nirmalya-panigrahi.github.io/"
          >https://nirmalya-panigrahi.github.io/</a>
        </p>
      </div>
    </footer>

    <script>
      (function () {
        var normalize = function (path) {
          return (path || '/').replace(/\/index\.html?$/i, '/').replace(/\/+$/, '') || '/';
        };

        var currentPath = normalize(window.location.pathname);
        var links = document.querySelectorAll('.bench-footer .bench-footer__link');

        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          var linkPath = normalize(link.pathname);
          var isCurrent =
            currentPath === linkPath ||
            (linkPath !== '/' && currentPath.indexOf(linkPath + '/') === 0);

          if (isCurrent) {
            var span = document.createElement('span');
            span.className = 'bench-footer__current';
            span.setAttribute('aria-current', 'page');
            span.textContent = link.textContent;

            var cell = link.parentNode;
            if (cell) {
              cell.className += ' is-current';
              cell.replaceChild(span, link);
            }
            break;
          }
        }
      })();
    </script>
  </body>
</html>
